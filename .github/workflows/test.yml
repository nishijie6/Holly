name: test

# Every branch, not just main: the point is to catch a break the moment it
# is pushed, including on branches an agent is working on.
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency security audit
        run: npm audit --audit-level=high

      # Lands with fix/admin-code-worker-isolation; no-ops until then.
      - name: Integration tests
        run: npm run --if-present test:integration
